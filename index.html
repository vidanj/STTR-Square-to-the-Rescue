<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Square to the Rescue</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060d;
        color: #e6e9ff;
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      canvas {
        background: #05060d;
        image-rendering: pixelated;
        box-shadow: 0 0 60px rgba(80, 120, 255, 0.25);
        border: 1px solid rgba(120, 150, 255, 0.2);
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
